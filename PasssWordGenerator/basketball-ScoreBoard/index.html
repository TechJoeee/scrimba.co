<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="div">
            <h3>HOME</h3>
            <span id="homeScore">0</span>
            <div class="btns">
                <button id="" onclick="add1h()">+1</button>
                <button id="" onclick="add2h()">+2</button>
                <button id="" onclick="add3h()">+3</button>
            </div>
            
        </div>
        <div class="div" >
            <h3>GUEST</h3>
            <span id="guestScore">0</span>
            <div class="btns">
                <button onclick="add1g()">+1</button>
                <button onclick="add2g()">+2</button>
                <button onclick="add3g()">+3</button>
            </div>
        </div>
   
    </div>

    <script src = 'index.js'></script>
</body>
</html>
